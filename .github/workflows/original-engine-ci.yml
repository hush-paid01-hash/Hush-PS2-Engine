name: Original Hush engine CI

on:
  push:
    branches:
      - main
      - "ci/**"
      - "feat/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hush-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-engine:
    name: Configure, build, and run native engine tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build g++

      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build all engine targets
        run: cmake --build build --parallel 2

      - name: Run all registered tests
        run: ctest --test-dir build --output-on-failure
