name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Build and test native PS2 engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure native engine
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile native engine and tests
        run: cmake --build build --parallel 2

      - name: Run engine regression tests
        run: ctest --test-dir build --output-on-failure

  docker:
    name: Build and publish Hush engine container
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ vars.DOCKER_USER }}
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKER_USER != '' && env.DOCKER_PAT != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PAT }}

      # Use Docker Build Cloud when credentials are configured.
      # Otherwise, use the standard Buildx driver to build without publishing.
      - name: Docker Setup Buildx Cloud
        if: env.DOCKER_USER != '' && env.DOCKER_PAT != ''
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: cloud
          endpoint: hushpaid01/hush

      - name: Docker Setup Buildx
        if: env.DOCKER_USER == '' || env.DOCKER_PAT == ''
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && env.DOCKER_USER != '' && env.DOCKER_PAT != '' }}
          tags: ${{ (vars.DOCKER_USER || 'local') }}/hush-ps2-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
